<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141b3d;
            --bg-card: #1a2347;
            --accent-primary: #00d9ff;
            --accent-secondary: #7c3aed;
            --text-primary: #e8edf4;
            --text-secondary: #8b95ab;
            --border-color: #2a3558;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 8px 32px rgba(0, 217, 255, 0.15);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 0.875rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9375rem;
            transition: all 0.3s ease;
            resize: vertical;
        }

        textarea {
            min-height: 200px;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
        }

        .radio-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: none;
            letter-spacing: normal;
            font-weight: 400;
        }

        .radio-label:hover {
            border-color: var(--accent-primary);
            background: rgba(0, 217, 255, 0.05);
        }

        input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="radio"]:checked {
            border-color: var(--accent-primary);
        }

        input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--accent-primary);
            border-radius: 50%;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 217, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .preview-area {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .preview-area::-webkit-scrollbar {
            width: 8px;
        }

        .preview-area::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 4px;
        }

        .preview-area::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        .qr-preview {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.3s ease;
            animation: scaleIn 0.4s ease-out both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .qr-preview:hover {
            transform: scale(1.05);
        }

        .qr-preview canvas {
            width: 100%;
            height: auto;
        }

        .qr-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: #0a0e27;
            text-align: center;
            word-break: break-all;
        }

        .status {
            margin-top: 1rem;
            padding: 0.875rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .status.show {
            display: flex;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--accent-primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QR Generator Pro</h1>
            <p class="subtitle">// Create beautiful QR codes with labels</p>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2 class="card-title">Input Codes</h2>
                
                <div class="input-group">
                    <label>Enter codes (one per line)</label>
                    <textarea id="codesInput" placeholder="A-00-B-01&#10;A-00-B-02&#10;A-00-B-03"></textarea>
                </div>

                <div class="input-group">
                    <label>Orientation</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="orientation" value="landscape" checked>
                            <span>Landscape</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="orientation" value="portrait">
                            <span>Portrait</span>
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label>PDF Filename</label>
                    <input type="text" id="filename" value="qr_codes" placeholder="Enter filename">
                </div>

                <button class="btn" id="generateBtn" onclick="generateQRCodes()">
                    <span>Generate QR Codes</span>
                </button>

                <div class="status" id="status"></div>
            </div>

            <div class="card">
                <h2 class="card-title">Preview</h2>
                <div id="previewArea" class="preview-area">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        <p>Your QR codes will appear here</p>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Built for generating QR codes with labels • Export to PDF</p>
        </footer>
    </div>

    <script>
        let qrData = [];

        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type} show`;
            setTimeout(() => {
                status.classList.remove('show');
            }, 5000);
        }

        function generateQRCodes() {
            const input = document.getElementById('codesInput').value.trim();
            
            if (!input) {
                showStatus('Please enter at least one code', 'error');
                return;
            }

            const codes = input.split('\n').filter(line => line.trim());
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = '';
            qrData = [];

            codes.forEach((code, index) => {
                // Create preview container
                const preview = document.createElement('div');
                preview.className = 'qr-preview';
                preview.style.animationDelay = `${index * 0.05}s`;

                // Create label
                const label = document.createElement('div');
                label.className = 'qr-label';
                label.textContent = code;
                preview.appendChild(label);

                // Create QR code container
                const qrContainer = document.createElement('div');
                preview.appendChild(qrContainer);

                // Generate QR code
                const qr = new QRCode(qrContainer, {
                    text: code,
                    width: 200,
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                previewArea.appendChild(preview);

                // Store data for PDF generation
                setTimeout(() => {
                    const canvas = qrContainer.querySelector('canvas');
                    if (canvas) {
                        qrData.push({
                            code: code,
                            dataUrl: canvas.toDataURL('image/png')
                        });
                    }
                }, 100);
            });

            showStatus(`Generated ${codes.length} QR code${codes.length > 1 ? 's' : ''}`, 'success');
        }

        async function downloadPDF() {
            if (qrData.length === 0) {
                showStatus('Please generate QR codes first', 'error');
                return;
            }

            const { jsPDF } = window.jspdf;
            const orientation = document.querySelector('input[name="orientation"]:checked').value;
            const filename = document.getElementById('filename').value.trim() || 'qr_codes';

            // Show loading state
            const btn = document.getElementById('generateBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span><span class="loading"></span> Generating PDF...</span>';
            btn.disabled = true;

            try {
                // PDF dimensions in mm
                const pageWidth = orientation === 'landscape' ? 297 : 210;
                const pageHeight = orientation === 'landscape' ? 210 : 297;
                const margin = 30;
                const qrSize = 80;
                const innerWidth = pageWidth - (margin * 2);
                const innerHeight = pageHeight - (margin * 2);

                const pdf = new jsPDF({
                    orientation: orientation === 'landscape' ? 'l' : 'p',
                    unit: 'mm',
                    format: 'a4'
                });

                for (let i = 0; i < qrData.length; i++) {
                    if (i > 0) {
                        pdf.addPage();
                    }

                    const data = qrData[i];

                    // Calculate positions for centering
                    const qrX = (pageWidth - qrSize) / 2;
                    
                    // Add label text
                    pdf.setFontSize(16);
                    pdf.setFont('helvetica', 'bold');
                    const textWidth = pdf.getTextWidth(data.code);
                    const textX = (pageWidth - textWidth) / 2;
                    const textY = margin + 10;
                    
                    pdf.text(data.code, textX, textY);

                    // Add QR code
                    const qrY = textY + 5;
                    pdf.addImage(data.dataUrl, 'PNG', qrX, qrY, qrSize, qrSize);
                }

                pdf.save(`${filename}.pdf`);
                showStatus('PDF downloaded successfully!', 'success');
            } catch (error) {
                console.error('PDF generation error:', error);
                showStatus('Failed to generate PDF', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Update the generate button to also trigger PDF download
        document.getElementById('generateBtn').onclick = async function() {
            generateQRCodes();
            // Wait a bit for QR codes to render
            setTimeout(() => {
                if (qrData.length > 0) {
                    downloadPDF();
                }
            }, 500);
        };

        // Allow Enter key to submit in textarea
        document.getElementById('codesInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                generateQRCodes();
            }
        });
    </script>
</body>
</html>
